session_name: vue-examples
start_directory: "."
windows:
  - window_name: edit-run
    layout: even-vertical
    focus: true
    shell_command_before:
      - echo initial command
    panes:
      - shell_command: echo "pane 1"
        focus: true
      - shell_command: echo "pane 2"
  - window_name: git
    layout: even-horizontal
    panes:
      - jj log -s && echo jj log -s
      - eza -lDT && echo eza -lDT
